<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Little Village</title>
    <meta name="theme-color" content="#3b7d4f" />
    <!-- iOS full-screen "app" behaviour when launched from Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Village" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- Top HUD: resources + season -->
      <div id="hud-top" class="hud">
        <div class="stat" id="stat-pop"><span class="ico">👤</span><span class="val">0</span></div>
        <div class="stat" id="stat-builders" title="Idle builders"><span class="ico">🔨</span><span class="val">0</span></div>
        <div class="stat" id="stat-food"><span class="ico">🌾</span><span class="val">0</span></div>
        <div class="stat" id="stat-wood"><span class="ico">🪵</span><span class="val">0</span></div>
        <div class="stat" id="stat-firewood"><span class="ico">🔥</span><span class="val">0</span></div>
        <div class="stat" id="stat-stone"><span class="ico">🪨</span><span class="val">0</span></div>
        <div class="stat" id="stat-coal"><span class="ico">⚫</span><span class="val">0</span></div>
        <div class="spacer"></div>
        <div class="stat season" id="stat-season"><span class="val">Spring · Yr 1</span></div>
      </div>

      <!-- Speed / menu controls -->
      <div id="controls">
        <button class="ctrl" id="btn-pause" title="Pause">⏸</button>
        <button class="ctrl" id="btn-speed" title="Speed">1×</button>
        <button class="ctrl" id="btn-new" title="New game">⟳</button>
      </div>

      <!-- Event log -->
      <div id="log"></div>

      <!-- Selected-tile / placement hint -->
      <div id="hint" class="hidden"></div>

      <!-- Bottom build menu -->
      <div id="build-menu"></div>

      <!-- Overlays -->
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
