<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Little Village</title>
    <meta name="theme-color" content="#3b7d4f" />
    <!-- iOS full-screen "app" behaviour when launched from Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Village" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- Camera rotate buttons, pinned to the top corners. Hold to rotate continuously. -->
      <button class="rotate-btn" id="btn-rot-left" title="Hold to rotate view left" aria-label="Hold to rotate view left">↺</button>
      <button class="rotate-btn" id="btn-rot-right" title="Hold to rotate view right" aria-label="Hold to rotate view right">↻</button>

      <!-- Top HUD: tier, then the village's state, then resources -->
      <div id="hud-top">
        <!-- How far along the village is — its own line at the very top, larger and set apart, so
             the one label that says what kind of place this is stands out. Ornaments flank it; the
             tier name and emoji fill in at runtime. What each tier *asks for* lives in the menu. -->
        <div class="hud-row tier-row">
          <div id="stat-tier" title="Village tier"><span class="orn">❧</span><span class="val">🏕️ Settlement</span><span class="orn">❧</span></div>
        </div>
        <!-- The village's people and time in one line: who is here, how healthy and happy they
             are, and what season it is. Health and happiness read as five pips apiece, one per 20
             points; the exact figure stays on the title for anyone who wants it. -->
        <div class="hud-row" id="hud-people">
          <div class="stat" id="stat-ages" title="children · students · adults"><span class="val">🧒0 🎓0 🧑0</span></div>
          <div class="stat meter" id="stat-health" title="Average health"><span class="pips"></span></div>
          <div class="stat meter" id="stat-happy" title="Average happiness"><span class="pips"></span></div>
          <div class="stat season" id="stat-season"><span class="val">Spring · Yr 1</span></div>
          <div class="stat hidden" id="stat-sick" title="Sick villagers"><span class="ico">🤒</span><span class="val">0</span></div>
        </div>
        <div class="hud-row" id="stat-resources"></div>
        <!-- The rules the village is living under. Empty and hidden until one is enacted, so it
             costs no room in the HUD on the many villages that never build a Town Hall. -->
        <div class="hud-row hidden" id="hud-policies"></div>
      </div>

      <!-- Clock, panels and menu: one column down the right edge. -->
      <div id="controls">
        <button class="ctrl" id="btn-pause" title="Pause">⏸</button>
        <button class="ctrl" id="btn-speed" title="Speed">1×</button>
        <button class="ctrl" id="btn-village" title="Jobs & stockpile">📋</button>
        <button class="ctrl" id="btn-progress" title="Progression">📈</button>
        <button class="ctrl" id="btn-history" title="Village history">📜</button>
        <button class="ctrl" id="btn-menu" title="Menu">☰</button>
      </div>

      <!-- The one village menu (slide-in from right): four tabs — Jobs and Limits to set, History
           and Progress to read. The 📋/📈/📜 buttons all open this panel, each on its own tab. -->
      <div id="village" class="panel hidden"></div>

      <!-- Trade modal -->
      <div id="trade-overlay" class="hidden"></div>

      <!-- Nomad arrival prompt -->
      <div id="nomad" class="hidden"></div>

      <!-- Event log -->
      <div id="log"></div>

      <!-- Selected-tile / placement hint -->
      <div id="hint" class="hidden"></div>

      <!-- Confirm bar: drawn paths and selected demolitions wait here for a decision -->
      <div id="confirm" class="hidden"></div>

      <!-- Inspect / inventory bottom sheet -->
      <div id="inspect" class="hidden"></div>

      <!-- Build: category buildings pop out above the toolbar -->
      <div id="popout" class="hidden"></div>
      <!-- Bottom toolbar: build categories and tools in two rows across the full width. Two rows
           so every tool fits a phone's width without a sideways scroll. -->
      <div id="toolbar">
        <div id="tools"></div>
      </div>

      <!-- Overlays -->
      <div id="overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
